<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Content Factory - Approval Queue</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand">Content Factory</div>
        <div class="navlinks">
      <a href="/index.html">Overview</a>
      <a href="/stories.html">Story review</a>
      <a href="/queue.html" class="active">Approval queue</a>
      <a href="/agents.html">Agents</a>
      <a href="/analytics.html">Analytics</a>
      <a href="/pipeline.html">Pipeline</a>
      <a href="/channels.html">Channels</a>
      <a href="/settings.html">Settings</a>
    </div>
    <button class="logout" onclick="logout()">Log out</button>
  </nav>

  <main class="page">
    <h1>Approval queue</h1>
    <p class="subtitle">Videos here have been scripted, voiced, and assembled. Watch each one and approve or reject before it can be scheduled.</p>
    <div id="queueList"></div>
  </main>

  <script src="/app.js"></script>
  <script>
    async function load() {
      const videos = await api('/api/videos?stage=pending_review');
      const container = document.getElementById('queueList');
      if (!videos || videos.length === 0) {
        container.innerHTML = '<p class="empty">Nothing waiting for review right now.</p>';
        return;
      }
      container.innerHTML = videos.map(v => `
        <div class="review-card" id="video-${v.id}">
          <div class="review-header">
            <span class="channel-tag">${v.channel_name}</span>
            <span class="video-title">${v.title || '(untitled)'}</span>
          </div>
          ${v.video_file_path
            ? `<video controls class="review-video" src="${v.video_file_path}"></video>`
            : `<div class="no-video">No video file attached yet - this item is still upstream in the pipeline.</div>`}
          <details class="script-toggle">
            <summary>Show script</summary>
            <pre class="script-text">${(v.script_final || v.script_draft || '(no script attached)').replace(/</g,'&lt;')}</pre>
          </details>
          <div class="review-actions">
            <textarea id="notes-${v.id}" placeholder="Optional note (e.g. why you're rejecting)"></textarea>
            <div class="button-row">
              <button class="approve-btn" onclick="approve(${v.id})">Approve</button>
              <button class="reject-btn" onclick="reject(${v.id})">Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function approve(id) {
      const notes = document.getElementById(`notes-${id}`).value;
      const res = await fetch(`/api/videos/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes }),
      });
      if (res.ok) {
        document.getElementById(`video-${id}`).remove();
      } else {
        const err = await res.json();
        alert(err.error || 'Could not approve');
      }
    }

    async function reject(id) {
      const reason = document.getElementById(`notes-${id}`).value;
      if (!reason) { alert('Add a short reason before rejecting - it helps you spot patterns later.'); return; }
      await fetch(`/api/videos/${id}/reject`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      });
      document.getElementById(`video-${id}`).remove();
    }

    load();
  </script>
</body>
</html>
